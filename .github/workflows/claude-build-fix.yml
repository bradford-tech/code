name: Claude build-failure fix

on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [claude-build-fix-trigger]

# One in-flight fix per issue. Newer triggers queue behind the current run so
# the counter can't be misread, and so two events don't both spawn Claude.
concurrency:
  group: claude-build-fix-${{ github.event.issue.number || github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  fix:
    # Path 1: human (or non-GITHUB_TOKEN actor) added `build-failure` to an issue.
    # Path 2/3: cron workflow dispatched `claude-build-fix-trigger`.
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'build-failure') ||
      github.event_name == 'repository_dispatch'
    # macos-15, not ubuntu: the product is a macOS arm64 app, and the fixer's
    # job is to VERIFY fixes before pushing (dev/ci-verify.sh = prepare + npm
    # ci + compile), which needs the build toolchain and the build platform.
    # Free macos-15 (unlimited minutes on public repos), NOT macos-15-xlarge —
    # xlarge is billed even here, and the compile tier fits the free runner's
    # 7 GB RAM with ci-verify's default 6 GB Node heap. Full packaging
    # (vscode-min-prepack's 8 GB heap) stays on the cron's xlarge builder.
    runs-on: macos-15
    # 120 min budget. Was 45 with --max-turns 50, and 1.133.0 showed that is
    # not enough: two of three attempts died on "Reached maximum number of
    # turns (50)" without ever opening a PR. That release broke four patches at
    # once, and one of them needed a full regenerate — enumerate the breaks,
    # roll the tree, rebase each, re-verify, push. Raised again 90 -> 120 when
    # in-session verification landed: one ci-verify pass costs ~20-30 min
    # (npm ci + compile), and starving the verify step just re-creates the
    # push-and-pray loop. Hitting either ceiling still consumes an attempt, so
    # an under-sized budget doesn't fail safe, it just burns the cap without
    # producing a fix.
    timeout-minutes: 120
    env:
      # Single source of truth for the attempt cap; every gate, message and the
      # prompt read it. Raised 3 -> 5 because attempts are marked BEFORE Claude
      # runs (deliberately, so a crash can't retry forever), which means infra
      # failures spend them: on 1.133.0 attempt 1 died instantly on "your
      # organization has disabled Claude subscription access" having done no
      # work at all, leaving only two real attempts for a four-patch break.
      FIX_ATTEMPT_CAP: "5"
      # Separate, smaller cap for VOIDED attempts — runs where Claude died
      # before doing any work (auth outage, subscription refusal) and the
      # attempt marker was rewritten to a void marker so it doesn't burn
      # FIX_ATTEMPT_CAP. Three voids on one issue means the loop's own
      # infrastructure is broken; escalate to a human instead of retrying
      # daily forever.
      INFRA_VOID_CAP: "3"
      # Who Claude's fix PRs get assigned to. Must be a repo collaborator;
      # check with `gh api /repos/<owner>/<repo>/assignees/<login>` (204 = ok).
      PR_ASSIGNEE: sbs44
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Resolve which issue number we're operating on and what failing run kicked
      # this off. The fields live in different places on the two event payloads.
      #
      # SECURITY: repository_dispatch payloads are attacker-controllable by anyone
      # with a token holding `repo` scope on this repo. BOTH dispatched fields
      # flow into Claude's prompt template (lines further down) and so are a
      # prompt-injection vector — newlines + "ignore prior instructions" text
      # would be passed verbatim into Claude's context. We fail loudly on either:
      #   - issue_number not purely numeric
      #   - run_url not a recognizable GitHub Actions run URL
      # The regex on run_url is intentionally tight: only the host (alphanumerics,
      # dots, hyphens) and the GH Actions run path (alphanumerics, dots, slashes,
      # hyphens, underscores ending in `/actions/runs/<digits>`). A newline or
      # synthetic instruction text cannot match.
      - name: Resolve issue number + run URL
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_FROM_LABEL: ${{ github.event.issue.number }}
          ISSUE_FROM_DISPATCH: ${{ github.event.client_payload.issue_number }}
          RUN_URL_FROM_DISPATCH: ${{ github.event.client_payload.run_url }}
          MS_TAG_FROM_DISPATCH: ${{ github.event.client_payload.ms_tag }}
          MS_COMMIT_FROM_DISPATCH: ${{ github.event.client_payload.ms_commit }}
        run: |
          set -eo pipefail
          # Default to main's pin; the dispatch overrides it below when it
          # carries the tag/commit the build actually failed on.
          target_tag=$(jq -r '.tag' upstream/stable.json)
          target_commit=$(jq -r '.commit' upstream/stable.json)

          if [ "$EVENT_NAME" = "issues" ]; then
            # github.event.issue.number is GitHub-generated, always numeric.
            echo "issue_number=$ISSUE_FROM_LABEL" >> "$GITHUB_OUTPUT"
            # No run URL on a human label-add; leave blank — Claude is told to
            # fall back to `gh run list --workflow cron-build-and-release.yml`.
            echo "run_url=" >> "$GITHUB_OUTPUT"
          else
            if ! printf '%s' "$ISSUE_FROM_DISPATCH" | grep -Eq '^[0-9]+$'; then
              echo "::error::client_payload.issue_number is not a positive integer: '$ISSUE_FROM_DISPATCH'"
              exit 1
            fi
            if ! printf '%s' "$RUN_URL_FROM_DISPATCH" | grep -Eq '^https://[A-Za-z0-9.-]+/[A-Za-z0-9._/-]+/actions/runs/[0-9]+$'; then
              echo "::error::client_payload.run_url is not a GitHub Actions run URL: '$RUN_URL_FROM_DISPATCH'"
              exit 1
            fi
            echo "issue_number=$ISSUE_FROM_DISPATCH" >> "$GITHUB_OUTPUT"
            echo "run_url=$RUN_URL_FROM_DISPATCH" >> "$GITHUB_OUTPUT"

            # ms_tag/ms_commit are optional (older dispatches and human label
            # adds omit them) but attacker-controllable when present, and they
            # flow into `git fetch` and a cache key. Same tight shape checks the
            # other dispatched fields get; a bad value fails loudly rather than
            # silently falling back, so a malformed payload can't quietly build
            # the wrong commit.
            if [ -n "$MS_COMMIT_FROM_DISPATCH" ] || [ -n "$MS_TAG_FROM_DISPATCH" ]; then
              if ! printf '%s' "$MS_TAG_FROM_DISPATCH" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::client_payload.ms_tag is not semver-shaped: '$MS_TAG_FROM_DISPATCH'"
                exit 1
              fi
              if ! printf '%s' "$MS_COMMIT_FROM_DISPATCH" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "::error::client_payload.ms_commit is not a 40-char hex SHA: '$MS_COMMIT_FROM_DISPATCH'"
                exit 1
              fi
              target_tag="$MS_TAG_FROM_DISPATCH"
              target_commit="$MS_COMMIT_FROM_DISPATCH"
            fi
          fi

          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"
          echo "::notice::Fix target: vscode $target_tag ($target_commit)"

      # Count prior attempt markers on the issue. The marker is an HTML comment
      # so it never renders to the human reader but is greppable via the API.
      # NOTE: the marker string `<!-- claude-build-fix-attempt -->` is also
      # written below in the "Mark this attempt" step. Keep them in sync.
      #
      # Two filters combine to close the channel:
      #   1. user.login == "github-actions[bot]" — excludes human-pasted
      #      markers AND markers in claude[bot]-authored PR comments.
      #   2. body | startswith("<!-- claude-build-fix-attempt -->") — the
      #      marker must be the FIRST line of the comment. Claude has
      #      `gh issue comment` access (Bash is in the settings allowlist
      #      with GH_TOKEN in the env), so if a Claude iteration quoted or
      #      paraphrased a prior marker, the marker text would land on a
      #      later line (Markdown blockquote prefix, intro sentence, etc.) —
      #      `contains` would inflate the counter, `startswith` won't.
      # The Mark this attempt step below preserves the "marker is first line"
      # invariant. If you ever reorder its heredoc body, also revisit here.
      #
      # Why raw REST instead of `gh issue view --json comments`: `gh` normalizes
      # bot logins by stripping the `[bot]` suffix (`github-actions[bot]` becomes
      # `github-actions`). The author-scoping filter was silently never matching
      # — counter always returned 0, cap was effectively disabled. The raw API
      # preserves the canonical `[bot]`-suffixed login on `.user.login`, which
      # also matches the GitHub UI's attribution and what every other GitHub
      # actor-filter in this org keys on. --paginate handles any issue thread
      # with >30 comments (the per-page default) so the counter doesn't undercount.
      - name: Count prior fix attempts
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.ctx.outputs.issue_number }}
        run: |
          # pipefail so a `gh` API failure doesn't silently leave $attempts blank
          # and let the workflow no-op forever on the next dispatch.
          set -eo pipefail
          # One paginated fetch, two counters. Real attempts start with the
          # attempt marker; attempts that died before doing any work (auth
          # outage, quota refusal — see "Void attempt marker" below) get
          # PATCHed to start with the void marker instead, so they stop
          # counting against FIX_ATTEMPT_CAP but stay countable on their own:
          # a run of voids means the loop infra itself is broken and retrying
          # daily forever would be its own failure mode.
          comments=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
                       --jq '[.[]
                              | select(.user.login == "github-actions[bot]")
                              | .body]')
          attempts=$(echo "$comments" | jq '[.[] | select(startswith("<!-- claude-build-fix-attempt -->"))] | length')
          voids=$(echo "$comments" | jq '[.[] | select(startswith("<!-- claude-build-fix-attempt-void -->"))] | length')
          attempt_num=$((attempts + 1))
          if [ "$attempts" -lt "$FIX_ATTEMPT_CAP" ] && [ "$voids" -lt "$INFRA_VOID_CAP" ]; then
            proceed=true
          else
            proceed=false
          fi
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "voids=$voids" >> "$GITHUB_OUTPUT"
          echo "attempt_num=$attempt_num" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "::notice::Prior attempts on issue #$ISSUE: $attempts (cap ${FIX_ATTEMPT_CAP}), voided infra failures: $voids (cap ${INFRA_VOID_CAP}), proceed=$proceed"

      # Cap-hit branch: post the summary comment FIRST (audit record), then
      # swap labels, then surface the terminal state on the Actions UI.
      # Order matters: if the label PATCH fails after a successful comment, the
      # next dispatch will hit the cap again and re-run this step idempotently.
      # If we swapped labels first and the comment failed, the label would say
      # "human owns this" with no explanatory record on the issue thread.
      # The workflow itself still exits 0 — we don't want it filing a
      # build-failure issue against itself.
      - name: Give up at cap
        if: fromJSON(steps.count.outputs.attempts) >= fromJSON(env.FIX_ATTEMPT_CAP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.ctx.outputs.issue_number }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -eo pipefail
          # If we've already announced the cap on this issue, short-circuit:
          # otherwise a human re-pushing to the fix PR (which re-fires
          # report-pr-failure) would re-trigger this step on every iteration
          # and append duplicate "Auto-fix loop stopped" comments forever.
          # The `needs-human` label is the canonical signal that we already
          # gave up; `gh issue view --json labels --jq` returns the list,
          # `grep -qx` matches exact lines (so 'needs-human-review' or
          # similar wouldn't false-positive).
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx needs-human; then
            echo "::notice::Cap already announced on issue #$ISSUE; skipping duplicate summary"
            exit 0
          fi
          gh issue comment "$ISSUE" --body "$(cat <<EOF
          Auto-fix loop stopped after ${FIX_ATTEMPT_CAP} attempts.

          Latest failing run: ${RUN_URL:-(see workflow history)}

          Swapping label \`build-failure\` -> \`needs-human\`. A person needs to look at the fix PR (or open one manually). The three prior attempt markers are above; \`gh run list --workflow cron-build-and-release.yml --status failure\` shows what each iteration tried.
          EOF
          )"
          # Defensively create `needs-human` so first-use on a repo without
          # the label pre-defined doesn't fail the workflow. `|| true` covers
          # the already-exists case across gh CLI versions.
          gh label create needs-human --color FBCA04 --description "Auto-fix loop gave up; human needs to take it from here" 2>/dev/null || true
          # Tolerate `build-failure` being already absent: on a re-trigger
          # after the cap already swapped labels, the human may have removed
          # the label or only the dispatch was re-fired. Either way, removing
          # an absent label should not red-X the workflow.
          gh issue edit "$ISSUE" --remove-label build-failure 2>/dev/null || true
          gh issue edit "$ISSUE" --add-label needs-human
          # Surface on the Actions run page itself — without this the workflow
          # finishes green and three failed iterations + one give-up look like a
          # successful run from the UI.
          echo "::warning::Auto-fix cap reached on issue #$ISSUE; label swapped to needs-human"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Cap reached on issue #$ISSUE

          Auto-fix loop stopped after **${FIX_ATTEMPT_CAP} attempts**. Label swapped from \`build-failure\` to \`needs-human\`.

          - Latest failing run: ${RUN_URL:-(see workflow history)}
          - Issue: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/$ISSUE
          EOF

      # Infra-failure branch: distinct from the cap above. Voided attempts did
      # no work (Claude died at spawn — auth outage, subscription refusal), so
      # they don't consume FIX_ATTEMPT_CAP; but INFRA_VOID_CAP of them on one
      # issue means the problem is the loop, not the build. Same terminal
      # state (needs-human) and the same idempotency guard, different message
      # so the human fixes the right thing.
      - name: Give up on persistent infra failure
        if: |
          fromJSON(steps.count.outputs.attempts) < fromJSON(env.FIX_ATTEMPT_CAP) &&
          fromJSON(steps.count.outputs.voids) >= fromJSON(env.INFRA_VOID_CAP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.ctx.outputs.issue_number }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -eo pipefail
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx needs-human; then
            echo "::notice::Infra give-up already announced on issue #$ISSUE; skipping duplicate summary"
            exit 0
          fi
          gh issue comment "$ISSUE" --body "$(cat <<EOF
          Auto-fix loop stopped: ${INFRA_VOID_CAP} attempts in a row died before doing any work (see the voided attempt markers above — typically an auth or subscription outage on the Claude action, not a build problem).

          Latest failing build run: ${RUN_URL:-(see workflow history)}

          Swapping label \`build-failure\` -> \`needs-human\`. Fix the workflow/credentials, then remove \`needs-human\` and re-add \`build-failure\` to restart the loop with a fresh budget.
          EOF
          )"
          gh label create needs-human --color FBCA04 --description "Auto-fix loop gave up; human needs to take it from here" 2>/dev/null || true
          gh issue edit "$ISSUE" --remove-label build-failure 2>/dev/null || true
          gh issue edit "$ISSUE" --add-label needs-human
          echo "::warning::Infra void cap reached on issue #$ISSUE; label swapped to needs-human"

      # Below-cap branch: mark this attempt BEFORE invoking Claude, so a crash
      # mid-action still counts. Avoids infinite-retry-on-transient-error.
      # NOTE: the marker string `<!-- claude-build-fix-attempt -->` is also
      # read above in the "Count prior fix attempts" step. Keep them in sync.
      #
      # INVARIANT: the marker MUST be the first line of the comment body.
      # The counter step uses `startswith` to filter out cases where the
      # marker text leaks into a Claude-paraphrased or human-quoted comment
      # (where it would naturally land on a later line). Don't reorder the
      # heredoc body to put a header line ahead of the marker.
      - name: Mark this attempt
        id: mark
        if: steps.count.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT_NUM: ${{ steps.count.outputs.attempt_num }}
          ISSUE: ${{ steps.ctx.outputs.issue_number }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -eo pipefail
          # gh api instead of `gh issue comment`: we need the comment id back,
          # so the void step below can rewrite THIS marker if Claude dies
          # before doing any work.
          marker_id=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            -f body="$(cat <<EOF
          <!-- claude-build-fix-attempt -->
          Starting fix attempt ${ATTEMPT_NUM}/${FIX_ATTEMPT_CAP} in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          Triggering failure: ${RUN_URL:-(none, manual label add)}
          EOF
          )" --jq .id)
          echo "marker_id=$marker_id" >> "$GITHUB_OUTPUT"

      # Pre-stage upstream vscode/ at the target commit (see ctx) so Claude
      # doesn't burn 3–5 min of its 45-min budget on the clone every iteration.
      # The split between cache/restore and cache/save (instead of the combined
      # actions/cache action) is deliberate: actions/cache auto-saves at job
      # end, which would persist Claude's *patch-modified* vscode/ as the cache
      # entry. Dry-apply on the next iteration would then start from a dirty
      # state. Save explicitly here, right after the clone, so the cache always
      # holds a clean pre-patch tree.
      #
      # Key is the target commit — the one the build actually failed on, which
      # the dispatch carries. It used to be hashFiles('upstream/stable.json'),
      # i.e. main's pin; that lags whenever release PRs sit unmerged, so the
      # cache was keyed to a commit the fix run didn't want and every attempt
      # both missed the cache and started from the wrong tree. GitHub LRU-evicts
      # old entries; the ~500MB-1GB vscode/ entries fit the 10GB repo budget.
      # Node + npm cache mirror the cron build job: ci-verify.sh runs
      # prepare_vscode.sh (npm ci) + the compile, and without the right Node
      # the preinstall check fails before Claude learns anything.
      - name: Setup Node
        if: steps.count.outputs.proceed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Cache npm packages
        if: steps.count.outputs.proceed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          # .nvmrc hash invalidates on a Node major bump (native-module ABI);
          # keyed to the TARGET commit, same reasoning as the vscode/ cache.
          key: npm-${{ hashFiles('.nvmrc') }}-${{ steps.ctx.outputs.target_commit }}
          restore-keys: |
            npm-${{ hashFiles('.nvmrc') }}-

      - name: Restore vscode/ cache
        id: vscode_cache
        if: steps.count.outputs.proceed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode
          key: vscode-${{ steps.ctx.outputs.target_commit }}

      # Cache miss → clone fresh. Partial clone + shallow fetch keeps the
      # network cost to ~30–60s. If the failing build was actually against an
      # upstream tag NEWER than what's pinned on main (cron fired on an
      # advance before the auto-release PR merged), Claude can `git fetch
      # --depth 1 origin <commit> && git checkout FETCH_HEAD` in place from
      # this base — still much faster than a full re-clone.
      - name: Pre-stage vscode/ at the target commit
        if: |
          steps.count.outputs.proceed == 'true' &&
          steps.vscode_cache.outputs.cache-hit != 'true'
        env:
          # Already shape-validated in the ctx step (semver tag, 40-hex commit),
          # whether it came from the dispatch or from upstream/stable.json.
          TARGET_TAG: ${{ steps.ctx.outputs.target_tag }}
          TARGET_COMMIT: ${{ steps.ctx.outputs.target_commit }}
        run: |
          set -eo pipefail
          # Defensive: if actions/cache/restore partially populated vscode/
          # without reporting cache-hit (cache-service blip; rare but observed
          # in the wild), the clone below would fail with "destination path
          # 'vscode' already exists" and burn an attempt on infra noise.
          rm -rf vscode
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/vscode.git vscode
          cd vscode
          git fetch --depth 1 origin "$TARGET_COMMIT"
          git checkout FETCH_HEAD
          echo "::notice::vscode/ ready at tag $TARGET_TAG commit $TARGET_COMMIT ($(du -sh . | cut -f1))"

      # Save the clean tree NOW, before Claude touches it. Skipped on cache
      # hit (entry already exists; save would no-op anyway, but the explicit
      # guard saves a 1–2s upload check).
      - name: Save clean vscode/ to cache
        if: |
          steps.count.outputs.proceed == 'true' &&
          steps.vscode_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode
          key: vscode-${{ steps.ctx.outputs.target_commit }}

      - name: Run Claude
        id: claude
        if: steps.count.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1
        with:
          allowed_bots: "*"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: .github/claude-code-settings.json
          # The superpowers plugin is published via the
          # `claude-plugins-official` marketplace at
          # github.com/anthropics/claude-plugins-official. That marketplace's
          # manifest pins a specific commit of github.com/obra/superpowers
          # (which is the actual source-of-truth repo for the skill). Using
          # the marketplace ref here means we pick up whatever SHA Anthropic
          # has curated; don't point at obra/superpowers directly unless you
          # specifically need to bypass that curation.
          # NOT anthropics/claude-code — that's the CLI source repo, not a
          # plugin marketplace.
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'superpowers@claude-plugins-official'
          additional_permissions: |
            actions: read
          # --max-turns 250: 50 was the binding constraint on 1.133.0, where two
          # attempts ended on "Reached maximum number of turns (50)" with no PR
          # opened. A four-patch break costs a turn per dry-apply inspection,
          # per reject read, per rebase and per re-verify, and the copilot patch
          # needed a regenerate-and-recheck cycle on top. Turns are only spent
          # when Claude acts, so a high ceiling costs nothing on easy breaks and
          # is the difference between converging and burning an attempt on hard
          # ones; timeout-minutes remains the real wall-clock guard.
          claude_args: |
            --model opus
            --max-turns 250
            --disallowedTools "Bash(gh pr merge:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git push -f:*)"
          # Branch protection on `main` is the only meaningful guard against
          # Claude pushing to / merging into main. The disallowedTools list
          # above only blocks the most obvious force-push and gh-merge paths;
          # it can't catch every refspec variant pointing at main (a previous
          # attempt at `Bash(git push:*main*)` was syntactically dead — `:*` is
          # only recognized at the end of a pattern, and no glob can cover
          # every `git push origin <sha>:refs/heads/main` shape Claude could
          # construct). Repo settings MUST keep branch protection on main:
          # require PR review + status checks before merge. If protection is
          # ever disabled, this loop loses its safety net.
          prompt: |
            /superpowers:systematic-debugging

            A BradfordCode build has failed and we need to fix it.

            Context:
            - Issue: #${{ steps.ctx.outputs.issue_number }}
            - Failing run: ${{ steps.ctx.outputs.run_url }}
            - This is attempt ${{ steps.count.outputs.attempt_num }} of ${{ env.FIX_ATTEMPT_CAP }}.
            - Upstream target: vscode ${{ steps.ctx.outputs.target_tag }} (${{ steps.ctx.outputs.target_commit }})

            If the failing run URL above is empty, fall back to:
              gh run list --workflow cron-build-and-release.yml --status failure --limit 1 --json databaseId,url

            FIRST, before any diagnosis, read docs/build-fix.md — the playbook
            for exactly this job (failure classes, patch/token mechanics, the
            verification workflow, and every trap that has cost an attempt in
            a past incident). Treat its checklists as mandatory.

            Second, warm-start from prior work instead of rediscovering it:
            read the attempt comments on issue #${{ steps.ctx.outputs.issue_number }},
            and look for an existing fix PR:
              gh pr list \
                --search "Refs #${{ steps.ctx.outputs.issue_number }} in:body state:open" \
                --json number,headRefName,author --jq '.[]'
            If one exists AND its author is `claude[bot]`, read its commits and
            comments, then push follow-up commits to ITS head ref
            (git fetch origin && git switch <headRefName>). Never open a
            duplicate PR — orphan PRs split the fix across branches that can
            never merge.

            Then follow systematic-debugging Phase 1 (root cause via
            `gh run view --log-failed`) BEFORE proposing any fix.

            `vscode/` is already staged at the upstream target above — the
            commit the build actually failed on, not main's pin — and Node
            matching .nvmrc is installed. No clone or setup needed.

            For any patch-apply failure, START with:

              ./dev/dry-apply-patches.sh

            It continues past failures, so one run names every broken patch
            (the build log only ever names the first). Fix ALL of them in this
            session.

            VERIFICATION CONTRACT — unlike earlier iterations of this loop,
            this runner can compile. Before you push:

              CI_BUILD=yes ./dev/ci-verify.sh --commit ${{ steps.ctx.outputs.target_commit }}

            runs prepare_vscode.sh (overlay + patches + npm ci) plus the
            TypeScript compile (~20-30 min; `--skip-prepare` re-compiles
            incrementally in minutes while you iterate on a fix in vscode/).
            Do not push until it passes. If you genuinely cannot get it to
            pass within the time budget, push anyway and state exactly what
            passed and what didn't in the PR body — never imply a verified
            fix without a passing run.

            Two rules that have each cost an attempt before:
              - Pin consistency: a PR build always builds the version pinned
                in upstream/stable.json. If this fix targets a newer upstream
                tag, the fix PR must ALSO bump upstream/stable.json (tag AND
                commit) or its build clones the old tree and fails instantly.
              - Regenerated patches must keep their `!!TOKEN!!` placeholders
                (!!APP_NAME!! etc.) — apply patches RAW when regenerating so
                `git diff` reproduces the tokens. Then run the playbook's
                regenerated-patch checklist (silent deletions, dangling
                imports, new upstream importers, stale type aliases).

            Open a PR (or push to the existing fix PR for this issue) that
            addresses the root cause.

            Hard rules:
              - Never push to main.
              - Never force-push.
              - Never merge.
              - If opening a new PR, the PR body MUST contain the line:

                  Refs #${{ steps.ctx.outputs.issue_number }}

                on its own line. The cron's `report-pr-failure` job parses this line
                to dispatch the next iteration; without it, the loop breaks.

      # Attempts are marked BEFORE Claude runs so a crash can't retry forever
      # — but that means a run that died at spawn (auth outage, subscription
      # refusal: issue #45 attempt 1 died in 22s at turn 1, $0 spent, and
      # still consumed a third of the cap) burns budget having done nothing.
      # This step rewrites the marker to a void marker when the Claude step
      # failed AND its execution transcript shows ≤3 turns. The counter step
      # excludes void markers from FIX_ATTEMPT_CAP and counts them against
      # INFRA_VOID_CAP instead. Parse failures leave the marker in place —
      # bounded-by-default, same philosophy as pre-marking.
      - name: Void attempt marker on infra failure
        if: |
          always() &&
          steps.count.outputs.proceed == 'true' &&
          steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER_ID: ${{ steps.mark.outputs.marker_id }}
          ATTEMPT_NUM: ${{ steps.count.outputs.attempt_num }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -eo pipefail
          if [ -z "$MARKER_ID" ]; then
            echo "::warning::No marker comment id recorded; cannot void"
            exit 0
          fi
          num_turns=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            num_turns=$(jq -r 'if type=="array" then (.[-1].num_turns // empty) else empty end' \
                          "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          if ! printf '%s' "$num_turns" | grep -Eq '^[0-9]+$'; then
            echo "::notice::num_turns unparseable ('$num_turns'); leaving attempt marker in place"
            exit 0
          fi
          if [ "$num_turns" -gt 3 ]; then
            echo "::notice::Claude ran $num_turns turns before failing — real attempt, marker stands"
            exit 0
          fi
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$MARKER_ID" \
            -f body="$(cat <<EOF
          <!-- claude-build-fix-attempt-void -->
          Attempt ${ATTEMPT_NUM} VOIDED: Claude died after ${num_turns} turn(s) without doing any work (auth/infra failure, not a fix failure) in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Not counted against the attempt cap.
          EOF
          )"
          echo "::warning::Attempt ${ATTEMPT_NUM} voided (infra death at ${num_turns} turns); not counted against FIX_ATTEMPT_CAP"

      # Claude opens the fix PR itself, so there is no `gh pr create` here to
      # hang an --assignee off; assign afterwards instead.
      #
      # `always()`: Claude routinely opens the PR and then exhausts turns or
      # times out, and that PR still needs an owner — gating on success would
      # leave exactly the PRs a human must pick up unassigned. Never fatal, for
      # the same reason: the fix work is already pushed by this point.
      - name: Assign the fix PR
        if: always() && steps.count.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.ctx.outputs.issue_number }}
        run: |
          set -eo pipefail
          # Match `Refs #<issue>` on its own line, the same marker
          # report-pr-failure keys on. Filtering client-side rather than via
          # `--search "... in:body"` on purpose: the search index lags PR
          # creation by seconds-to-minutes, so a just-opened PR is routinely
          # invisible to it. The line anchors also stop `Refs #45` matching an
          # issue-450 PR, and stop a quoted/blockquoted mention counting.
          pr=$(gh pr list --state open --limit 100 --json number,body \
               | jq -r --arg issue "$ISSUE" '
                   [ .[] | select(.body | test("(^|\n)Refs #" + $issue + "(\r?\n|$)")) ]
                   | .[0].number // empty')

          if [ -z "$pr" ]; then
            echo "::notice::No open PR references \"Refs #${ISSUE}\"; nothing to assign"
            exit 0
          fi

          if gh pr edit "$pr" --add-assignee "$PR_ASSIGNEE"; then
            echo "::notice::Assigned $PR_ASSIGNEE to fix PR #$pr"
          else
            echo "::warning::Could not assign $PR_ASSIGNEE to PR #$pr. \
          Check they are still a collaborator (gh api /repos/${GITHUB_REPOSITORY}/assignees/$PR_ASSIGNEE)."
          fi
