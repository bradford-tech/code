name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip claude[bot] PRs: every auto-fix iteration would otherwise burn an
    # extra review session per push. The build itself is the regression check
    # for the fix loop.
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'claude[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: .github/claude-code-settings.json
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          track_progress: true
          additional_permissions: |
            actions: read
          # Defense in depth. The actual guard against pushing changes back
          # is the job-level `permissions: contents: read` above — even if
          # Claude wrote files, it couldn't push them. Stripping
          # Edit/Write/NotebookEdit here additionally prevents the
          # code-review skill from calling those tools in response to a
          # prompt-injection attempt in the PR body, keeping the session's
          # behavior intent-aligned ("review only"). Bash stays allowed
          # because the code-review skill uses `gh` to read the PR; note
          # that Bash can still write files via `tee` / `sed -i` / `cat >`,
          # but again, the contents: read permission keeps that local.
          claude_args: '--model opus --disallowedTools "Edit,Write,NotebookEdit"'
