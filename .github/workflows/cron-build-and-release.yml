name: cron-build-and-release

on:
  schedule:
    - cron: '0 6 * * *'    # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build the pinned VS Code version (from upstream/stable.json) regardless of whether upstream has advanced'
        type: boolean
        default: false
  # PR trigger feeds the Claude auto-fix loop. The build job builds + bundles
  # only; release/codesign/notarize jobs are gated out below.
  #
  # `paths:` keeps doc-only / workflow-tweak / CLAUDE.md PRs from burning ~25
  # min of macos-15 runner time. The list covers every input to the build:
  # patches applied to upstream, `src/stable/` overlay, the build/prepare
  # scripts, product.json overlay, the pinned upstream commit, and the cron
  # workflow itself. `.nvmrc` is included because Node-version bumps have
  # broken builds before (NODE_MODULE_VERSION ABI). If you add a new file
  # that affects the build, also add it here. See
  # docs/superpowers/specs/2026-06-08-claude-build-failure-auto-fix-design.md.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'patches/**'
      - 'src/stable/**'
      - 'build.sh'
      - 'build/**'
      - 'prepare_vscode.sh'
      - 'prepare_assets.sh'
      - 'get_repo.sh'
      - 'utils.sh'
      - 'product.json'
      - 'upstream/stable.json'
      - '.nvmrc'
      - '.github/workflows/cron-build-and-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write   # release job opens the auto-release PR; check job queries open ones

concurrency:
  # Per-PR concurrency on PR events (cancel the in-flight run when a new commit
  # lands — Claude's loop pushes iterations that should supersede each other,
  # not queue behind a 25-min macOS build). Cron + workflow_dispatch + push
  # events all collapse to refs/heads/main, preserving the original "don't
  # overlap cron runs" property.
  #
  # Note: `cancel-in-progress` is evaluated against the NEW event's context,
  # not the in-flight run's. That's safe here because the group key already
  # isolates cron (refs/heads/main) from per-PR runs (PR number) — a cron
  # event can never land in the same concurrency group as a PR build, so
  # turning cancel on for PRs can't cancel an in-flight cron run.
  group: cron-build-and-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check for new VS Code release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      ms_tag: ${{ steps.compare.outputs.ms_tag }}
      ms_commit: ${{ steps.compare.outputs.ms_commit }}
      release_version: ${{ steps.compare.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read current pin
        id: current
        run: |
          tag=$(jq -r '.tag' upstream/stable.json)
          commit=$(jq -r '.commit' upstream/stable.json)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Query upstream VS Code latest stable
        id: upstream
        run: |
          for attempt in 1 2 3; do
            if curl -sf 'https://update.code.visualstudio.com/api/update/darwin/stable/0000000000000000000000000000000000000000' -o /tmp/update.json; then
              break
            fi
            echo "Attempt $attempt failed, retrying in 60s..." >&2
            sleep 60
          done
          if [[ ! -s /tmp/update.json ]]; then
            echo "Failed to fetch VS Code update info after 3 attempts" >&2
            exit 1
          fi
          ms_tag=$(jq -r '.name' /tmp/update.json)
          ms_commit=$(jq -r '.version' /tmp/update.json)
          echo "ms_tag=$ms_tag" >> "$GITHUB_OUTPUT"
          echo "ms_commit=$ms_commit" >> "$GITHUB_OUTPUT"

      - name: Compare and decide
        id: compare
        env:
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
          CURRENT_COMMIT: ${{ steps.current.outputs.commit }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.ms_tag }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.ms_commit }}
          FORCE_BUILD: ${{ inputs.force_build }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # force_build: build the *pinned* version regardless of upstream changes.
          #   Used to verify the workflow against a known-good pin, or to rebuild
          #   after pushing a workflow/script fix without bumping VS Code.
          # pull_request: build the *PR's pinned* version so we test what the PR
          #   actually changes. Critical for the Claude auto-fix loop — without
          #   this, a PR pinning 1.123.0 would either (a) chase upstream-latest
          #   into a different tag, or (b) be skipped entirely when upstream
          #   already matches the pin, leaving report-pr-failure dormant and the
          #   PR misleadingly green. See spec section "Architecture / PR builds".
          # Cron (force_build=false): build only if upstream advanced past the
          #   pin AND no auto-release PR is already pending for that upstream
          #   tag AND microsoft/vscode has actually pushed the git tag. The PR
          #   guard avoids rebuilding the same version daily while the release
          #   PR is waiting for human review. The tag-existence guard catches
          #   the MS update API announcing a release before the corresponding
          #   git tag is pushed (typically a few-hour gap) — without it, the
          #   build job spins up a macOS-15 runner for ~25 min only to fail at
          #   `Clone VS Code source` (issue #10). get_repo.sh has the same
          #   check as defense-in-depth; catching it here saves the runner.
          if [[ "$FORCE_BUILD" == "true" || "$EVENT_NAME" == "pull_request" ]]; then
            ms_tag="$CURRENT_TAG"
            ms_commit="$CURRENT_COMMIT"
            needs_build=true
            reason="$EVENT_NAME: building PR's/pinned $ms_tag"
          elif [[ "$UPSTREAM_TAG" != "$CURRENT_TAG" ]]; then
            # Check for an open auto-release PR that already pins this upstream
            # tag. `--search "$UPSTREAM_TAG in:title"` matches the title we set
            # in the release job ("chore(release): <RELEASE_VERSION> (vscode
            # <MS_TAG>)"). Empty result → field is absent in jq output → falls
            # through to the next guard.
            existing_pr=$(gh pr list \
              --state open \
              --label auto-release \
              --search "$UPSTREAM_TAG in:title" \
              --json number \
              --jq '.[0].number // empty')
            if [[ -n "$existing_pr" ]]; then
              ms_tag="$CURRENT_TAG"
              ms_commit="$CURRENT_COMMIT"
              needs_build=false
              reason="open auto-release PR #$existing_pr already pins $UPSTREAM_TAG; awaiting human merge"
            # Tag-existence guard: wire-protocol query against microsoft/vscode
            # (no clone, ~1s). git ls-remote prints `<sha> refs/tags/<tag>` if
            # the ref exists, nothing otherwise — `grep -q .` distinguishes.
            # A network failure surfaces as step failure (set -eo pipefail is
            # GitHub Actions' default for `run:` blocks), not a silent skip,
            # so a real outage doesn't quietly stop daily builds.
            elif ! git ls-remote https://github.com/microsoft/vscode.git "refs/tags/$UPSTREAM_TAG" | grep -q .; then
              ms_tag="$CURRENT_TAG"
              ms_commit="$CURRENT_COMMIT"
              needs_build=false
              reason="update API announced $UPSTREAM_TAG but microsoft/vscode hasn't pushed the tag yet; next cron will retry"
            else
              ms_tag="$UPSTREAM_TAG"
              ms_commit="$UPSTREAM_COMMIT"
              needs_build=true
              reason="upstream advanced from $CURRENT_TAG to $ms_tag"
            fi
          else
            ms_tag="$CURRENT_TAG"
            ms_commit="$CURRENT_COMMIT"
            needs_build=false
            reason="upstream tag $UPSTREAM_TAG matches pin; skipping"
          fi

          time_patch=$(printf "%04d" $(($(date +%-j) * 24 + $(date +%-H))))
          release_version="${ms_tag}${time_patch}"

          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
          echo "ms_tag=$ms_tag" >> "$GITHUB_OUTPUT"
          echo "ms_commit=$ms_commit" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "::notice::$reason (release_version=$release_version)"

  build:
    name: Build BradfordCode (macOS arm64)
    needs: check
    # Gate three classes of PR out of the build:
    #   - Fork PRs: would burn ~25–45 min of macos-15 runner time on
    #     attacker-controllable source (modifications to build.sh, patches/,
    #     etc.). Cron and same-repo PRs (incl. Claude's auto-fix PRs) still run.
    #   - `auto-release` PRs: the release job that opened the PR just built
    #     this exact version seconds before. Rebuilding it on the PR trigger
    #     would waste another ~25 min for no signal. The required-status-check
    #     rule has been removed from the ruleset, so a skipped build doesn't
    #     block merge — see docs/.../2026-06-08-claude-build-failure-auto-fix-design.md.
    if: |
      needs.check.outputs.needs_build == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'auto-release')))
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APP_NAME: BradfordCode
      OS_NAME: osx
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
      SHOULD_BUILD_CLI: "no"
      # ZIP feeds Electron's macOS auto-updater (Squirrel.Mac extracts via
      # `ditto -x -k`, which only handles PKZip). DMG is for fresh installs.
      # PR builds skip both: every Claude iteration would otherwise burn Apple
      # notarytool quota for no extra signal beyond build + bundle success.
      SHOULD_BUILD_ZIP: ${{ github.event_name == 'pull_request' && 'no' || 'yes' }}
      SHOULD_BUILD_DMG: ${{ github.event_name == 'pull_request' && 'no' || 'yes' }}
      CI_BUILD: "yes"
      DISABLE_UPDATE: "no"
      MS_TAG: ${{ needs.check.outputs.ms_tag }}
      MS_COMMIT: ${{ needs.check.outputs.ms_commit }}
      RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
      # Authenticate api.github.com calls during npm postinstall (ripgrep) and
      # gulp builtin-extension fetches; raises rate limit from 60/h to 5000/h.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CERTIFICATE_OSX_P12_DATA: ${{ secrets.CERTIFICATE_OSX_P12_DATA }}
      CERTIFICATE_OSX_P12_PASSWORD: ${{ secrets.CERTIFICATE_OSX_P12_PASSWORD }}
      CERTIFICATE_OSX_ID: ${{ secrets.CERTIFICATE_OSX_ID }}
      CERTIFICATE_OSX_APP_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APP_PASSWORD }}
      CERTIFICATE_OSX_TEAM_ID: ${{ secrets.CERTIFICATE_OSX_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache npm packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          # Include the .nvmrc hash so changing Node major automatically invalidates
          # the cache. Without this, native modules built against the old Node
          # (e.g. macos-alias from `npx create-dmg`, NODE_MODULE_VERSION 127 vs 137)
          # survive a Node bump and crash with ERR_DLOPEN_FAILED.
          key: npm-${{ hashFiles('.nvmrc') }}-${{ env.MS_COMMIT }}
          restore-keys: |
            npm-${{ hashFiles('.nvmrc') }}-

      - name: Pin upstream VS Code (in-job, not committed)
        run: |
          jq --arg tag "$MS_TAG" --arg commit "$MS_COMMIT" \
            '.tag = $tag | .commit = $commit' \
            upstream/stable.json > /tmp/stable.json
          mv /tmp/stable.json upstream/stable.json
          cat upstream/stable.json

      - name: Clone VS Code source
        run: ./get_repo.sh

      - name: Build BradfordCode.app
        run: ./build.sh

      # Skip the entire sign+notarize+ZIP+DMG+checksum+upload chain on PR
      # builds. Two reasons, one for each step class:
      #   - prepare_assets.sh: build/osx/prepare_assets.sh runs `xcrun
      #     notarytool submit --wait` whenever CERTIFICATE_OSX_P12_DATA is
      #     set, INDEPENDENT of SHOULD_BUILD_ZIP/DMG. Cert secrets are
      #     available to same-repo PRs (Claude's auto-fix PRs), so without
      #     this gate every Claude iteration burns Apple notary quota + 3-10
      #     min wait — defeating the headline quota-saving goal.
      #   - SHA-compute / artifact-uploads: with SHOULD_BUILD_ZIP/DMG=no, no
      #     artifacts land in assets/, prepare_checksums.sh writes no
      #     sidecars, and the SHA-compute step's [[ -f ]] guard would
      #     hard-fail every PR build with "Expected SHA-256 sidecar not
      #     found" — meaningless failure for Claude to chase.
      # On PR builds, `./build.sh` exit 0 is the success signal.
      - name: Sign + notarize + DMG
        if: github.event_name != 'pull_request'
        run: ./prepare_assets.sh

      - name: Compute artifact SHA-256s
        if: github.event_name != 'pull_request'
        id: hash
        run: |
          dmg_sha_file="assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg.sha256"
          zip_sha_file="assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip.sha256"
          for f in "$dmg_sha_file" "$zip_sha_file"; do
            if [[ ! -f "$f" ]]; then
              echo "Expected SHA-256 sidecar not found: $f" >&2
              ls -la assets/ >&2
              exit 1
            fi
          done
          dmg_sha256=$(awk '{print $1}' "$dmg_sha_file")
          zip_sha256=$(awk '{print $1}' "$zip_sha_file")
          echo "dmg_sha256=$dmg_sha256" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$zip_sha256" >> "$GITHUB_OUTPUT"
          echo "::notice::DMG SHA-256 = $dmg_sha256"
          echo "::notice::ZIP SHA-256 = $zip_sha256"

      - name: Upload DMG artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg
          path: assets/BradfordCode.arm64.${{ env.RELEASE_VERSION }}.dmg
          retention-days: 90
          if-no-files-found: error

      - name: Upload DMG SHA-256 sidecar artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-sha256
          path: assets/BradfordCode.arm64.${{ env.RELEASE_VERSION }}.dmg.sha256
          retention-days: 90
          if-no-files-found: error

      # ZIP filename uses dashes + `darwin-` prefix to match the upstream
      # `${APP_NAME}-darwin-${VSCODE_ARCH}-${RELEASE_VERSION}.zip` pattern in
      # build/osx/prepare_assets.sh; the DMG uses dotted segments because
      # `npx create-dmg` is what produces it. Don't try to unify them here
      # without also patching upstream.
      - name: Upload ZIP artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip
          path: assets/BradfordCode-darwin-arm64-${{ env.RELEASE_VERSION }}.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload ZIP SHA-256 sidecar artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-sha256
          path: assets/BradfordCode-darwin-arm64-${{ env.RELEASE_VERSION }}.zip.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: |
            *.log
            vscode/.build/extensions/*.failed
          retention-days: 30
          if-no-files-found: ignore
    outputs:
      dmg_sha256: ${{ steps.hash.outputs.dmg_sha256 }}
      zip_sha256: ${{ steps.hash.outputs.zip_sha256 }}

  # Remote extension host server, consumed by jeanp413.open-remote-ssh when
  # connecting BradfordCode to a linux-x64 host. Runs in parallel with the
  # macOS client job and takes RELEASE_VERSION from the same `check` output —
  # that shared value is what makes the client's and server's synthetic
  # commits match, so the extension's default `strict` validation passes with
  # no user settings. See docs/superpowers/plans/2026-08-09-linux-reh-server-build.md.
  build-reh:
    name: Build REH server (linux x64)
    needs: check
    # Same gating as the macOS build job: skip fork PRs and auto-release PRs.
    if: |
      needs.check.outputs.needs_build == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'auto-release')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_NAME: BradfordCode
      OS_NAME: linux
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "yes"
      SHOULD_BUILD_REH_WEB: "no"
      SHOULD_BUILD_CLI: "no"
      SHOULD_BUILD_ZIP: "no"
      SHOULD_BUILD_DMG: "no"
      CI_BUILD: "yes"
      DISABLE_UPDATE: "no"
      MS_TAG: ${{ needs.check.outputs.ms_tag }}
      MS_COMMIT: ${{ needs.check.outputs.ms_commit }}
      RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This job only reads the recipe and uploads artifacts; it never
          # pushes. Leaving the token in .git/config would hand it to every
          # npm postinstall script the VS Code build runs.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      # Native modules built during `npm ci`: kerberos needs libkrb5-dev,
      # keytar/secret needs libsecret-1-dev, and the shared VS Code build
      # needs the X11 headers even though we only ship the server.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libkrb5-dev \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev

      - name: Cache npm packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: npm-reh-${{ hashFiles('.nvmrc') }}-${{ env.MS_COMMIT }}
          path: ~/.npm
          restore-keys: |
            npm-reh-${{ hashFiles('.nvmrc') }}-

      - name: Pin upstream VS Code (in-job, not committed)
        run: |
          jq --arg tag "$MS_TAG" --arg commit "$MS_COMMIT" \
            '.tag = $tag | .commit = $commit' \
            upstream/stable.json > /tmp/stable.json
          mv /tmp/stable.json upstream/stable.json
          cat upstream/stable.json

      - name: Clone VS Code source
        run: ./get_repo.sh

      - name: Build REH server
        run: ./build.sh

      - name: Package REH tarball
        run: ./prepare_assets.sh

      # The contract that actually matters at connect time. The remote install
      # script runs `tar -xf ... --strip-components 1` and then executes
      # $SERVER_DIR/bin/code-server, so the archive must carry `./bin/code-server`
      # and product.json must agree on the commit the client will send.
      - name: Verify REH tarball layout
        id: hash
        run: |
          asset="assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz"
          sha_file="${asset}.sha256"
          for f in "$asset" "$sha_file"; do
            if [[ ! -f "$f" ]]; then
              echo "Expected REH artifact not found: $f" >&2
              ls -la assets/ >&2
              exit 1
            fi
          done
          if ! tar -tzf "$asset" | grep -qx './bin/code-server'; then
            echo "REH tarball does not contain ./bin/code-server" >&2
            tar -tzf "$asset" | head -40 >&2
            exit 1
          fi
          # Compare against BUILD_SOURCEVERSION, NOT vscode/product.json. The
          # source product.json has no `commit` key at all — gulp injects it at
          # package time from BUILD_SOURCEVERSION (sha1 of RELEASE_VERSION, set
          # by version.sh and exported to GITHUB_ENV by the build step). The
          # macOS client derives its commit the same way from the same
          # RELEASE_VERSION, so this asserts client and server agree — which is
          # what open-remote-ssh's default `strict` validation checks.
          if [[ -z "$BUILD_SOURCEVERSION" ]]; then
            echo "BUILD_SOURCEVERSION is unset; ./build.sh should have exported it via GITHUB_ENV" >&2
            exit 1
          fi
          server_commit=$(tar -xzOf "$asset" ./product.json | jq -r '.commit')
          if [[ "$server_commit" != "$BUILD_SOURCEVERSION" ]]; then
            echo "REH commit $server_commit != expected client commit $BUILD_SOURCEVERSION" >&2
            exit 1
          fi
          reh_sha256=$(awk '{print $1}' "$sha_file")
          echo "reh_sha256=$reh_sha256" >> "$GITHUB_OUTPUT"
          echo "::notice::REH SHA-256 = $reh_sha256"
          echo "::notice::REH commit = $server_commit"

      - name: Upload REH artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reh-linux-x64
          path: assets/bradfordcode-reh-linux-x64-${{ env.RELEASE_VERSION }}.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Upload REH SHA-256 sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reh-linux-x64-sha256
          path: assets/bradfordcode-reh-linux-x64-${{ env.RELEASE_VERSION }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reh-logs
          path: |
            *.log
            vscode/.build/extensions/*.failed
          retention-days: 30
          if-no-files-found: ignore
    outputs:
      reh_sha256: ${{ steps.hash.outputs.reh_sha256 }}

  release:
    name: Publish release + update versions pin
    needs: [check, build, build-reh]
    if: |
      needs.build.result == 'success' &&
      needs['build-reh'].result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MS_TAG: ${{ needs.check.outputs.ms_tag }}
      MS_COMMIT: ${{ needs.check.outputs.ms_commit }}
      RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
      DMG_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
      ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
      REH_SHA256: ${{ needs['build-reh'].outputs.reh_sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dmg
          path: assets/

      - name: Download DMG SHA-256 sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dmg-sha256
          path: assets/

      - name: Download ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zip
          path: assets/

      - name: Download ZIP SHA-256 sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zip-sha256
          path: assets/

      - name: Download REH tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reh-linux-x64
          path: assets/

      - name: Download REH SHA-256 sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reh-linux-x64-sha256
          path: assets/

      - name: Sanity-check downloaded artifacts
        run: |
          dmg="assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg"
          dmg_sha="assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg.sha256"
          zip="assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip"
          zip_sha="assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip.sha256"
          reh="assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz"
          reh_sha="assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz.sha256"
          for f in "$dmg" "$dmg_sha" "$zip" "$zip_sha" "$reh" "$reh_sha"; do
            test -f "$f" || { echo "Missing $f" >&2; exit 1; }
          done
          echo "DMG size: $(stat -c%s "$dmg") bytes"
          echo "DMG SHA-256: ${DMG_SHA256}"
          echo "ZIP size: $(stat -c%s "$zip") bytes"
          echo "ZIP SHA-256: ${ZIP_SHA256}"
          echo "REH size: $(stat -c%s "$reh") bytes"
          echo "REH SHA-256: ${REH_SHA256}"

      - name: Update upstream/stable.json
        run: |
          jq --arg tag "$MS_TAG" --arg commit "$MS_COMMIT" \
            '.tag = $tag | .commit = $commit' \
            upstream/stable.json > /tmp/stable.json
          mv /tmp/stable.json upstream/stable.json

      - name: Write versions/stable/darwin-arm64/latest.json
        run: |
          # latest.json drives the in-app auto-updater (Squirrel.Mac), which
          # downloads `url` and extracts it via `ditto -x -k` — so it MUST be
          # the ZIP. The DMG is still attached to the release for fresh installs.
          mkdir -p versions/stable/darwin-arm64
          timestamp_ms=$(($(date +%s) * 1000 + $(date +%N) / 1000000))
          jq -n \
            --arg url "https://github.com/bradford-tech/code/releases/download/${RELEASE_VERSION}/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip" \
            --arg name "$RELEASE_VERSION" \
            --arg version "$MS_COMMIT" \
            --arg productVersion "$MS_TAG" \
            --arg hash "$ZIP_SHA256" \
            --argjson timestamp "$timestamp_ms" \
            '{url: $url, name: $name, version: $version, productVersion: $productVersion, hash: $hash, timestamp: $timestamp, supportsFastUpdate: true}' \
            > versions/stable/darwin-arm64/latest.json
          cat versions/stable/darwin-arm64/latest.json

      # Replaces the prior "commit & push to main with rebase-and-retry" flow.
      # Main is now protected by a ruleset that requires every change go
      # through a PR; the cron's GITHUB_TOKEN has no bypass. Instead:
      #   1. Ensure the `auto-release` label exists.
      #   2. Branch off main, commit the pin + latest.json updates, push the
      #      feature branch.
      #   3. Create the GitHub Release with --target pointing at that branch
      #      (so the release tag references the commit that *contains* the pin
      #      advance, even if the PR sits for hours awaiting human merge).
      #   4. Open the PR for human review.
      #
      # The build job is gated to skip when the PR carries `auto-release`, so
      # the cron's pull_request trigger doesn't rebuild this same version.
      # See docs/superpowers/specs/2026-06-08-claude-build-failure-auto-fix-design.md.
      - name: Ensure auto-release label exists
        run: |
          gh label create auto-release \
            --color 0E8A16 \
            --description "Cron release PR; safe to merge once you've reviewed" \
            2>/dev/null || true

      - name: Create release branch and push
        id: release_branch
        run: |
          set -eo pipefail
          branch="release/${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Idempotent: if a previous partial run of this job left the branch
          # around (e.g. the gh-release call failed after the push), blow it
          # away and recreate. Safe because RELEASE_VERSION is timestamp-derived
          # per run, so the branch we'd overwrite came from this exact (failed)
          # iteration — nothing a human could be tracking yet.
          #
          # Use ls-remote to distinguish "branch absent" (expected on first
          # run, OK) from "delete failed" (auth, branch protection on
          # release/**, etc — should fail loudly, not be swallowed by
          # `|| true`). Without this check, a future branch-protection rule
          # on release/** would surface as a confusing non-fast-forward
          # error on the next `git push -u` instead of "couldn't delete".
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
          git checkout -B "$branch"
          git add upstream/stable.json versions/stable/darwin-arm64/latest.json
          git commit -m "chore(release): ${RELEASE_VERSION} (vscode ${MS_TAG})"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          BRANCH: ${{ steps.release_branch.outputs.branch }}
        run: |
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          ## BradfordCode ${RELEASE_VERSION}

          This release tracks **Microsoft VS Code ${MS_TAG}**.

          For upstream changes, see [microsoft/vscode releases](https://github.com/microsoft/vscode/releases/tag/${MS_TAG}).

          ### BradfordCode-specific properties

          - macOS arm64 only (Apple Silicon).
          - Signed by \`Developer ID Application: Bradford Technologies Group LLC (7AKC2YS2N2)\` and notarized by Apple.
          - Telemetry endpoints disabled at build time.
          - Extension marketplace points at [Open VSX](https://open-vsx.org); the bundled GitHub Copilot extension is removed.
          - GitHub sign-in uses a Personal Access Token instead of OAuth.

          ### Verification

          - DMG SHA-256: \`${DMG_SHA256}\`
          - ZIP SHA-256: \`${ZIP_SHA256}\`
          - Bundle identifier: \`tech.bradford.code\`
          - Notarization: \`spctl --assess --verbose /Applications/BradfordCode.app\` should return \`accepted, source=Notarized Developer ID\`.
          EOF

          # Idempotent: if a previous run partially created this release, delete it before recreating.
          gh release delete "${RELEASE_VERSION}" --yes 2>/dev/null || true

          # --target points the release tag at the release branch HEAD rather
          # than main HEAD. The PR may sit unmerged for hours awaiting human
          # review; without --target the tag would point at stale main and the
          # release would advertise the wrong commit on its sidebar.
          gh release create "${RELEASE_VERSION}" \
            --title "BradfordCode ${RELEASE_VERSION}" \
            --notes-file "$notes_file" \
            --target "$BRANCH" \
            "assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg" \
            "assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg.sha256" \
            "assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip" \
            "assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip.sha256" \
            "assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz" \
            "assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz.sha256"

      - name: Open auto-release PR
        env:
          BRANCH: ${{ steps.release_branch.outputs.branch }}
        run: |
          set -eo pipefail
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_VERSION}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Auto-generated release PR — the build already succeeded and the
          GitHub Release is already published with signed, notarized artifacts.
          Merging this PR advances main's pinned upstream version and points
          the in-app auto-updater at the new ZIP.

          - **VS Code tag:** \`${MS_TAG}\`
          - **VS Code commit:** \`${MS_COMMIT}\`
          - **GitHub Release:** ${release_url}
          - **Build run:** ${run_url}

          ### Artifact verification

          - DMG SHA-256: \`${DMG_SHA256}\`
          - ZIP SHA-256: \`${ZIP_SHA256}\`

          ### What happens on merge

          - \`upstream/stable.json\` advances to track \`${MS_TAG}\`.
          - \`versions/stable/darwin-arm64/latest.json\` points at the new
            ZIP; the in-app auto-updater (Squirrel.Mac) picks it up on its
            next poll.

          ### Why the build status check is missing

          The build job on this PR is skipped — the same version was just
          built and notarized in run ${GITHUB_RUN_ID} above. The skip is
          gated by the \`auto-release\` label; see the build job \`if:\` in
          \`.github/workflows/cron-build-and-release.yml\`.
          EOF

          # Idempotent: if an OPEN PR already exists for this branch, leave
          # it in place rather than failing. Must filter on `--state open`
          # explicitly — `gh pr view <branch>` doesn't filter by state and
          # would return a closed PR. That matters here because the previous
          # step ran `git push origin --delete "$branch"` which auto-closes
          # any prior PR pointed at this branch. Falling for the closed PR
          # would leave us with a release + branch but no open PR, and the
          # next cron's `--state open` filter would never see it.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::Open PR #$existing already exists for $BRANCH; skipping create"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): ${RELEASE_VERSION} (vscode ${MS_TAG})" \
              --label auto-release \
              --body-file "$body_file"
          fi

  report-failure:
    name: Open issue on failure
    needs: [check, build, build-reh, release]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # createDispatchEvent (POST /repos/{owner}/{repo}/dispatches) requires
      # contents: write. Without it the dispatch returns 403, the issue still
      # gets filed (issues: write covers that), but the Claude loop never wakes.
      contents: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MS_TAG: ${{ needs.check.outputs.ms_tag }}
        with:
          script: |
            const msTag = process.env.MS_TAG || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titleStem = `Build failure: vscode ${msTag}`;

            // Look for an existing open issue for this VS Code tag
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failure',
              per_page: 100,
            });
            const existing = issues.find(i => i.title.startsWith(titleStem));

            const commentBody = [
              `Build failure on workflow run [${context.runId}](${runUrl}).`,
              ``,
              `- Triggered by: \`${context.eventName}\``,
              `- VS Code tag: \`${msTag}\``,
              `- Run started: ${new Date().toISOString()}`,
              ``,
              `See the run for full logs.`,
            ].join('\n');

            let issueNumber;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });
              core.notice(`Commented on existing issue #${existing.number}`);
              issueNumber = existing.number;
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titleStem} (run ${context.runId})`,
                body: commentBody,
                labels: ['build-failure'],
              });
              core.notice(`Opened issue #${created.number}`);
              issueNumber = created.number;
            }

            // The label-add above does not fire `issues.labeled` on other
            // workflows because it was performed by GITHUB_TOKEN. Use
            // repository_dispatch (which IS exempt from that suppression rule)
            // to wake the claude-build-fix workflow.
            //
            // NOTE: the event_type string 'claude-build-fix-trigger' is matched
            // by claude-build-fix.yml's `on.repository_dispatch.types` and is
            // ALSO emitted by report-pr-failure below. Keep all three in sync.
            //
            // Guard against a future permission regression: if `contents:
            // write` is ever dropped from this job's permissions, the
            // dispatch returns 403 silently and the loop never wakes. Surface
            // it as a job failure instead of a green run.
            core.notice(`Dispatching claude-build-fix-trigger for issue #${issueNumber}`);
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'claude-build-fix-trigger',
                client_payload: {
                  issue_number: issueNumber,
                  run_url: runUrl,
                },
              });
            } catch (err) {
              core.setFailed(
                `Failed to dispatch claude-build-fix-trigger for issue #${issueNumber}: ` +
                `${err.status || ''} ${err.message}. ` +
                `Check job permissions — repos.createDispatchEvent requires \`contents: write\`.`
              );
            }

  report-pr-failure:
    name: Dispatch Claude fix loop on PR failure
    needs: [check, build]
    if: |
      failure() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      # createDispatchEvent (POST /repos/{owner}/{repo}/dispatches) requires
      # contents: write — read is not enough. Without it the dispatch returns
      # 403 and the loop breaks after attempt 1 (cap is unreachable).
      contents: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // The PR body must contain `Refs #<n>` (Claude is instructed to
            // include this in any PR it opens — see the prompt's "Hard rules"
            // section in claude-build-fix.yml). Parse the original cron-failure
            // issue number out of it so markers and counter stay on one thread.
            //
            // Two cases when Refs # is absent:
            //   - Claude-authored PR: prompt is misconfigured → fail loudly.
            //   - Human-authored PR: not part of the auto-fix loop at all →
            //     no dispatch needed, no red check. Reviewers shouldn't see a
            //     failing "Dispatch Claude fix loop" status on every WIP PR.
            const body = context.payload.pull_request.body || '';
            // Anchor to a full line: `^…$` with the `m` flag matches the
            // marker only when `Refs #<n>` is the entire line. Without `m`,
            // a stray "...originally tracked in #5..." in prose would
            // false-match and dispatch the loop against the wrong issue,
            // silently desynchronizing the counter.
            const m = body.match(/^Refs #(\d+)$/m);
            if (!m) {
              const author = context.payload.pull_request.user.login;
              if (author === 'claude[bot]') {
                core.setFailed(
                  `Claude-authored PR #${context.issue.number} has no "Refs #<n>" line. ` +
                  `Prompt likely misconfigured — fix loop cannot continue.`
                );
              } else {
                core.notice(
                  `PR #${context.issue.number} (author: ${author}) is not part of ` +
                  `the auto-fix loop (no "Refs #<n>"); skipping dispatch.`
                );
              }
              return;
            }

            const issueNumber = parseInt(m[1], 10);
            core.notice(`Dispatching claude-build-fix-trigger for issue #${issueNumber} (failing run: ${runUrl})`);

            // NOTE: the event_type string 'claude-build-fix-trigger' must
            // match claude-build-fix.yml's `on.repository_dispatch.types`.
            // Same dispatch is also emitted by report-failure above.
            //
            // See the matching try/catch in report-failure for rationale: a
            // silent 403 here would break the loop at attempt 2+ without any
            // surface signal.
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'claude-build-fix-trigger',
                client_payload: {
                  issue_number: issueNumber,
                  run_url: runUrl,
                },
              });
            } catch (err) {
              core.setFailed(
                `Failed to dispatch claude-build-fix-trigger for issue #${issueNumber}: ` +
                `${err.status || ''} ${err.message}. ` +
                `Check job permissions — repos.createDispatchEvent requires \`contents: write\`.`
              );
            }
