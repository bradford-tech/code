name: cron-build-and-release

on:
  schedule:
    - cron: '0 6 * * *'    # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build the pinned VS Code version (from upstream/stable.json) regardless of whether upstream has advanced'
        type: boolean
        default: false
  # PR trigger feeds the Claude auto-fix loop: build + bundle only, with
  # release/codesign/notarize gated off below. `paths:` lists every input to
  # the build so doc-only PRs don't burn macOS minutes — add new build inputs
  # here. `.nvmrc` counts because Node major bumps have broken builds (ABI).
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'patches/**'
      - 'src/stable/**'
      - 'build.sh'
      - 'build/**'
      - 'prepare_vscode.sh'
      - 'prepare_assets.sh'
      - 'get_repo.sh'
      - 'utils.sh'
      - 'product.json'
      - 'upstream/stable.json'
      - '.nvmrc'
      - '.github/workflows/cron-build-and-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write   # release job opens the auto-release PR; check job queries open ones

env:
  # Who every auto-created PR gets assigned to. Assigning needs the assignee to
  # be a repo collaborator; verify with
  #   gh api /repos/<owner>/<repo>/assignees/<login>   (204 = assignable)
  # GITHUB_TOKEN is sufficient here — `pull-requests: write` above covers it, so
  # no GitHub App token is needed just to assign.
  PR_ASSIGNEE: sbs44

concurrency:
  # Per-PR concurrency: a new commit supersedes the in-flight run instead of
  # queuing behind a 25-min build. Cron/dispatch/push all collapse to
  # refs/heads/main, preserving "don't overlap cron runs".
  #
  # `cancel-in-progress` is evaluated against the NEW event, but the group key
  # already isolates cron from per-PR runs, so a PR can never cancel a cron.
  group: cron-build-and-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check for new VS Code release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      ms_tag: ${{ steps.compare.outputs.ms_tag }}
      ms_commit: ${{ steps.compare.outputs.ms_commit }}
      release_version: ${{ steps.compare.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read current pin
        id: current
        run: |
          tag=$(jq -r '.tag' upstream/stable.json)
          commit=$(jq -r '.commit' upstream/stable.json)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Query upstream VS Code latest stable
        id: upstream
        run: |
          for attempt in 1 2 3; do
            if curl -sf 'https://update.code.visualstudio.com/api/update/darwin/stable/0000000000000000000000000000000000000000' -o /tmp/update.json; then
              break
            fi
            echo "Attempt $attempt failed, retrying in 60s..." >&2
            sleep 60
          done
          if [[ ! -s /tmp/update.json ]]; then
            echo "Failed to fetch VS Code update info after 3 attempts" >&2
            exit 1
          fi
          ms_tag=$(jq -r '.name' /tmp/update.json)
          ms_commit=$(jq -r '.version' /tmp/update.json)
          echo "ms_tag=$ms_tag" >> "$GITHUB_OUTPUT"
          echo "ms_commit=$ms_commit" >> "$GITHUB_OUTPUT"

      - name: Compare and decide
        id: compare
        env:
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
          CURRENT_COMMIT: ${{ steps.current.outputs.commit }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.ms_tag }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.ms_commit }}
          FORCE_BUILD: ${{ inputs.force_build }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # force_build / pull_request: build the PINNED version. For PRs this
          # is critical — chasing upstream-latest would test the wrong tag, and
          # skipping when upstream already matches the pin would leave the PR
          # misleadingly green with report-pr-failure dormant.
          # Cron: build only if upstream advanced past the pin, no auto-release
          # PR already pins that tag (avoids daily rebuilds while one awaits
          # review), and microsoft/vscode actually pushed the git tag — the
          # update API announces it hours early, and catching that here saves a
          # ~25-min runner that would fail at `Clone VS Code source` (issue #10).
          if [[ "$FORCE_BUILD" == "true" || "$EVENT_NAME" == "pull_request" ]]; then
            ms_tag="$CURRENT_TAG"
            ms_commit="$CURRENT_COMMIT"
            needs_build=true
            reason="$EVENT_NAME: building PR's/pinned $ms_tag"
          elif [[ "$UPSTREAM_TAG" != "$CURRENT_TAG" ]]; then
            # Matches the title the release job sets ("chore(release): <ver>
            # (vscode <tag>)"). Empty result → absent field → next guard.
            existing_pr=$(gh pr list \
              --state open \
              --label auto-release \
              --search "$UPSTREAM_TAG in:title" \
              --json number \
              --jq '.[0].number // empty')
            if [[ -n "$existing_pr" ]]; then
              ms_tag="$CURRENT_TAG"
              ms_commit="$CURRENT_COMMIT"
              needs_build=false
              reason="open auto-release PR #$existing_pr already pins $UPSTREAM_TAG; awaiting human merge"
            # Wire-protocol query, no clone (~1s). ls-remote prints the ref if
            # it exists, nothing otherwise. A network failure fails the step
            # (Actions defaults to set -eo pipefail), rather than skipping.
            elif ! git ls-remote https://github.com/microsoft/vscode.git "refs/tags/$UPSTREAM_TAG" | grep -q .; then
              ms_tag="$CURRENT_TAG"
              ms_commit="$CURRENT_COMMIT"
              needs_build=false
              reason="update API announced $UPSTREAM_TAG but microsoft/vscode hasn't pushed the tag yet; next cron will retry"
            else
              ms_tag="$UPSTREAM_TAG"
              ms_commit="$UPSTREAM_COMMIT"
              needs_build=true
              reason="upstream advanced from $CURRENT_TAG to $ms_tag"
            fi
          else
            ms_tag="$CURRENT_TAG"
            ms_commit="$CURRENT_COMMIT"
            needs_build=false
            reason="upstream tag $UPSTREAM_TAG matches pin; skipping"
          fi

          time_patch=$(printf "%04d" $(($(date +%-j) * 24 + $(date +%-H))))
          release_version="${ms_tag}${time_patch}"

          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
          echo "ms_tag=$ms_tag" >> "$GITHUB_OUTPUT"
          echo "ms_commit=$ms_commit" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "::notice::$reason (release_version=$release_version)"

  build:
    name: Build BradfordCode (macOS arm64)
    needs: check
    # Skip two PR classes: fork PRs (would run attacker-controllable build
    # scripts on a paid runner) and `auto-release` PRs (the release job just
    # built this exact version). Same-repo PRs, including Claude's auto-fix
    # PRs, still build. No required-status-check rule, so a skipped build
    # doesn't block merge. See
    # docs/superpowers/specs/2026-06-08-claude-build-failure-auto-fix-design.md.
    if: |
      needs.check.outputs.needs_build == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'auto-release')))
    # Larger runner, bought deliberately: macos-15 is free with unlimited
    # minutes on this public repo, but larger runners are billed even here
    # (~$1.90/build, ~$57/month for the daily cron). Measured on run
    # 31301283190: 6m33s to build vs 30-41 min on macos-15 (whole job 11m42s
    # vs ~36-45 min). Cause is likely RAM, not cores — build.sh asks for an
    # 8 GB Node heap that doesn't fit macos-15's 7 GB. Dropping that heap
    # under 7 GB may recover the gap for free and let us switch back.
    # Must stay arm64: macos-15-large is Intel and would cross-compile.
    runs-on: macos-15-xlarge
    timeout-minutes: 120
    env:
      APP_NAME: BradfordCode
      OS_NAME: osx
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
      SHOULD_BUILD_CLI: "no"
      # ZIP feeds Squirrel.Mac's auto-updater (it extracts via `ditto -x -k`,
      # PKZip only); DMG is for fresh installs. PR builds skip both to save
      # Apple notarytool quota.
      SHOULD_BUILD_ZIP: ${{ github.event_name == 'pull_request' && 'no' || 'yes' }}
      SHOULD_BUILD_DMG: ${{ github.event_name == 'pull_request' && 'no' || 'yes' }}
      CI_BUILD: "yes"
      DISABLE_UPDATE: "no"
      MS_TAG: ${{ needs.check.outputs.ms_tag }}
      MS_COMMIT: ${{ needs.check.outputs.ms_commit }}
      RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
      # Raises the api.github.com rate limit 60/h → 5000/h for the npm
      # postinstall and gulp builtin-extension fetches.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CERTIFICATE_OSX_P12_DATA: ${{ secrets.CERTIFICATE_OSX_P12_DATA }}
      CERTIFICATE_OSX_P12_PASSWORD: ${{ secrets.CERTIFICATE_OSX_P12_PASSWORD }}
      CERTIFICATE_OSX_ID: ${{ secrets.CERTIFICATE_OSX_ID }}
      CERTIFICATE_OSX_APP_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APP_PASSWORD }}
      CERTIFICATE_OSX_TEAM_ID: ${{ secrets.CERTIFICATE_OSX_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache npm packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          # The .nvmrc hash invalidates the cache on a Node major bump; without
          # it, native modules built against the old Node survive and crash
          # with ERR_DLOPEN_FAILED.
          key: npm-${{ hashFiles('.nvmrc') }}-${{ env.MS_COMMIT }}
          restore-keys: |
            npm-${{ hashFiles('.nvmrc') }}-

      - name: Pin upstream VS Code (in-job, not committed)
        run: |
          jq --arg tag "$MS_TAG" --arg commit "$MS_COMMIT" \
            '.tag = $tag | .commit = $commit' \
            upstream/stable.json > /tmp/stable.json
          mv /tmp/stable.json upstream/stable.json
          cat upstream/stable.json

      - name: Clone VS Code source
        run: ./get_repo.sh

      - name: Build BradfordCode.app
        run: ./build.sh

      # PR builds stop after build.sh — its exit 0 is the signal. Two reasons
      # to gate the rest: prepare_assets.sh notarizes whenever the cert secret
      # is set (independent of SHOULD_BUILD_ZIP/DMG), burning Apple quota on
      # every Claude iteration; and with no artifacts in assets/, the
      # SHA-compute guard would hard-fail every PR build anyway.
      - name: Sign + notarize + DMG
        if: github.event_name != 'pull_request'
        run: ./prepare_assets.sh

      - name: Compute artifact SHA-256s
        if: github.event_name != 'pull_request'
        id: hash
        run: |
          dmg_sha_file="assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg.sha256"
          zip_sha_file="assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip.sha256"
          for f in "$dmg_sha_file" "$zip_sha_file"; do
            if [[ ! -f "$f" ]]; then
              echo "Expected SHA-256 sidecar not found: $f" >&2
              ls -la assets/ >&2
              exit 1
            fi
          done
          dmg_sha256=$(awk '{print $1}' "$dmg_sha_file")
          zip_sha256=$(awk '{print $1}' "$zip_sha_file")
          echo "dmg_sha256=$dmg_sha256" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$zip_sha256" >> "$GITHUB_OUTPUT"
          echo "::notice::DMG SHA-256 = $dmg_sha256"
          echo "::notice::ZIP SHA-256 = $zip_sha256"

      - name: Upload DMG artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg
          path: assets/BradfordCode.arm64.${{ env.RELEASE_VERSION }}.dmg
          retention-days: 90
          if-no-files-found: error

      - name: Upload DMG SHA-256 sidecar artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-sha256
          path: assets/BradfordCode.arm64.${{ env.RELEASE_VERSION }}.dmg.sha256
          retention-days: 90
          if-no-files-found: error

      # ZIP uses dashes to match upstream's
      # `${APP_NAME}-darwin-${VSCODE_ARCH}-${RELEASE_VERSION}.zip`; the DMG
      # uses dots because `npx create-dmg` produces it. Unifying needs a patch.
      - name: Upload ZIP artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip
          path: assets/BradfordCode-darwin-arm64-${{ env.RELEASE_VERSION }}.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload ZIP SHA-256 sidecar artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-sha256
          path: assets/BradfordCode-darwin-arm64-${{ env.RELEASE_VERSION }}.zip.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: |
            *.log
            vscode/.build/extensions/*.failed
          retention-days: 30
          if-no-files-found: ignore
    outputs:
      dmg_sha256: ${{ steps.hash.outputs.dmg_sha256 }}
      zip_sha256: ${{ steps.hash.outputs.zip_sha256 }}

  # Remote extension host for jeanp413.open-remote-ssh. Runs parallel to the
  # macOS job and shares RELEASE_VERSION from `check` — that shared value makes
  # the client's and server's synthetic commits match, so the extension's
  # default `strict` validation passes with no user settings.
  build-reh:
    name: Build REH server (linux x64)
    needs: check
    # Same gating as the macOS build job: skip fork PRs and auto-release PRs.
    if: |
      needs.check.outputs.needs_build == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'auto-release')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_NAME: BradfordCode
      OS_NAME: linux
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "yes"
      SHOULD_BUILD_REH_WEB: "no"
      SHOULD_BUILD_CLI: "no"
      SHOULD_BUILD_ZIP: "no"
      SHOULD_BUILD_DMG: "no"
      CI_BUILD: "yes"
      DISABLE_UPDATE: "no"
      MS_TAG: ${{ needs.check.outputs.ms_tag }}
      MS_COMMIT: ${{ needs.check.outputs.ms_commit }}
      RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Never pushes; leaving the token in .git/config would expose it to
          # every npm postinstall script the build runs.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      # npm ci builds native modules: kerberos → libkrb5-dev, secret →
      # libsecret-1-dev, plus X11 headers the shared build needs even though
      # we only ship the server.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libkrb5-dev \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev

      - name: Cache npm packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: npm-reh-${{ hashFiles('.nvmrc') }}-${{ env.MS_COMMIT }}
          path: ~/.npm
          restore-keys: |
            npm-reh-${{ hashFiles('.nvmrc') }}-

      - name: Pin upstream VS Code (in-job, not committed)
        run: |
          jq --arg tag "$MS_TAG" --arg commit "$MS_COMMIT" \
            '.tag = $tag | .commit = $commit' \
            upstream/stable.json > /tmp/stable.json
          mv /tmp/stable.json upstream/stable.json
          cat upstream/stable.json

      - name: Clone VS Code source
        run: ./get_repo.sh

      - name: Build REH server
        run: ./build.sh

      - name: Package REH tarball
        run: ./prepare_assets.sh

      # The contract that matters at connect time: the remote extracts with
      # `--strip-components 1` then runs $SERVER_DIR/bin/code-server, so the
      # archive must carry ./bin/code-server and agree on the client's commit.
      - name: Verify REH tarball layout
        id: hash
        run: |
          asset="assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz"
          sha_file="${asset}.sha256"
          for f in "$asset" "$sha_file"; do
            if [[ ! -f "$f" ]]; then
              echo "Expected REH artifact not found: $f" >&2
              ls -la assets/ >&2
              exit 1
            fi
          done
          if ! tar -tzf "$asset" | grep -qx './bin/code-server'; then
            echo "REH tarball does not contain ./bin/code-server" >&2
            tar -tzf "$asset" | head -40 >&2
            exit 1
          fi
          # Compare to BUILD_SOURCEVERSION, NOT vscode/product.json — the
          # source product.json has no `commit` key (gulp injects it at package
          # time). The client derives its commit the same way from the same
          # RELEASE_VERSION, so this asserts the two agree, which is what
          # open-remote-ssh's default `strict` validation checks.
          if [[ -z "$BUILD_SOURCEVERSION" ]]; then
            echo "BUILD_SOURCEVERSION is unset; ./build.sh should have exported it via GITHUB_ENV" >&2
            exit 1
          fi
          server_commit=$(tar -xzOf "$asset" ./product.json | jq -r '.commit')
          if [[ "$server_commit" != "$BUILD_SOURCEVERSION" ]]; then
            echo "REH commit $server_commit != expected client commit $BUILD_SOURCEVERSION" >&2
            exit 1
          fi
          reh_sha256=$(awk '{print $1}' "$sha_file")
          echo "reh_sha256=$reh_sha256" >> "$GITHUB_OUTPUT"
          echo "::notice::REH SHA-256 = $reh_sha256"
          echo "::notice::REH commit = $server_commit"

      - name: Upload REH artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reh-linux-x64
          path: assets/bradfordcode-reh-linux-x64-${{ env.RELEASE_VERSION }}.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Upload REH SHA-256 sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reh-linux-x64-sha256
          path: assets/bradfordcode-reh-linux-x64-${{ env.RELEASE_VERSION }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reh-logs
          path: |
            *.log
            vscode/.build/extensions/*.failed
          retention-days: 30
          if-no-files-found: ignore
    outputs:
      reh_sha256: ${{ steps.hash.outputs.reh_sha256 }}

  release:
    name: Publish release + update versions pin
    needs: [check, build, build-reh]
    if: |
      needs.build.result == 'success' &&
      needs['build-reh'].result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MS_TAG: ${{ needs.check.outputs.ms_tag }}
      MS_COMMIT: ${{ needs.check.outputs.ms_commit }}
      RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
      DMG_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
      ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
      REH_SHA256: ${{ needs['build-reh'].outputs.reh_sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dmg
          path: assets/

      - name: Download DMG SHA-256 sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dmg-sha256
          path: assets/

      - name: Download ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zip
          path: assets/

      - name: Download ZIP SHA-256 sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zip-sha256
          path: assets/

      - name: Download REH tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reh-linux-x64
          path: assets/

      - name: Download REH SHA-256 sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reh-linux-x64-sha256
          path: assets/

      - name: Sanity-check downloaded artifacts
        run: |
          dmg="assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg"
          dmg_sha="assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg.sha256"
          zip="assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip"
          zip_sha="assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip.sha256"
          reh="assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz"
          reh_sha="assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz.sha256"
          for f in "$dmg" "$dmg_sha" "$zip" "$zip_sha" "$reh" "$reh_sha"; do
            test -f "$f" || { echo "Missing $f" >&2; exit 1; }
          done
          echo "DMG size: $(stat -c%s "$dmg") bytes"
          echo "DMG SHA-256: ${DMG_SHA256}"
          echo "ZIP size: $(stat -c%s "$zip") bytes"
          echo "ZIP SHA-256: ${ZIP_SHA256}"
          echo "REH size: $(stat -c%s "$reh") bytes"
          echo "REH SHA-256: ${REH_SHA256}"

      - name: Update upstream/stable.json
        run: |
          jq --arg tag "$MS_TAG" --arg commit "$MS_COMMIT" \
            '.tag = $tag | .commit = $commit' \
            upstream/stable.json > /tmp/stable.json
          mv /tmp/stable.json upstream/stable.json

      - name: Write versions/stable/darwin-arm64/latest.json
        run: |
          # Drives the in-app auto-updater (Squirrel.Mac), which extracts via
          # `ditto -x -k` — so `url` MUST be the ZIP, not the DMG.
          mkdir -p versions/stable/darwin-arm64
          timestamp_ms=$(($(date +%s) * 1000 + $(date +%N) / 1000000))
          jq -n \
            --arg url "https://github.com/bradford-tech/code/releases/download/${RELEASE_VERSION}/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip" \
            --arg name "$RELEASE_VERSION" \
            --arg version "$MS_COMMIT" \
            --arg productVersion "$MS_TAG" \
            --arg hash "$ZIP_SHA256" \
            --argjson timestamp "$timestamp_ms" \
            '{url: $url, name: $name, version: $version, productVersion: $productVersion, hash: $hash, timestamp: $timestamp, supportsFastUpdate: true}' \
            > versions/stable/darwin-arm64/latest.json
          cat versions/stable/darwin-arm64/latest.json

      # Main requires PRs and this token has no bypass, so rather than pushing:
      # branch off main, commit the pin + latest.json, push, create the Release
      # with --target on that branch, then open the PR. The build job skips
      # `auto-release` PRs so this version isn't rebuilt. See
      # docs/superpowers/specs/2026-06-08-claude-build-failure-auto-fix-design.md.
      - name: Ensure auto-release label exists
        run: |
          gh label create auto-release \
            --color 0E8A16 \
            --description "Cron release PR; safe to merge once you've reviewed" \
            2>/dev/null || true

      - name: Create release branch and push
        id: release_branch
        run: |
          set -eo pipefail
          branch="release/${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Idempotent: a leftover branch can only come from this run's own
          # failed attempt (RELEASE_VERSION is per-run), so recreating is safe.
          # ls-remote separates "absent" (fine) from "delete failed" (auth,
          # branch protection) so the latter fails loudly instead of surfacing
          # later as a confusing non-fast-forward push.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
          git checkout -B "$branch"
          git add upstream/stable.json versions/stable/darwin-arm64/latest.json
          git commit -m "chore(release): ${RELEASE_VERSION} (vscode ${MS_TAG})"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          BRANCH: ${{ steps.release_branch.outputs.branch }}
        run: |
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          ## BradfordCode ${RELEASE_VERSION}

          This release tracks **Microsoft VS Code ${MS_TAG}**.

          For upstream changes, see [microsoft/vscode releases](https://github.com/microsoft/vscode/releases/tag/${MS_TAG}).

          ### BradfordCode-specific properties

          - macOS arm64 only (Apple Silicon).
          - Signed by \`Developer ID Application: Bradford Technologies Group LLC (7AKC2YS2N2)\` and notarized by Apple.
          - Telemetry endpoints disabled at build time.
          - Extension marketplace points at [Open VSX](https://open-vsx.org); the bundled GitHub Copilot extension is removed.
          - GitHub sign-in uses a Personal Access Token instead of OAuth.

          ### Verification

          - DMG SHA-256: \`${DMG_SHA256}\`
          - ZIP SHA-256: \`${ZIP_SHA256}\`
          - Bundle identifier: \`tech.bradford.code\`
          - Notarization: \`spctl --assess --verbose /Applications/BradfordCode.app\` should return \`accepted, source=Notarized Developer ID\`.
          EOF

          # Idempotent: if a previous run partially created this release, delete it before recreating.
          gh release delete "${RELEASE_VERSION}" --yes 2>/dev/null || true

          # --target points the tag at the release branch, not main. The PR may
          # sit unmerged for hours; without it the tag would advertise stale main.
          gh release create "${RELEASE_VERSION}" \
            --title "BradfordCode ${RELEASE_VERSION}" \
            --notes-file "$notes_file" \
            --target "$BRANCH" \
            "assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg" \
            "assets/BradfordCode.arm64.${RELEASE_VERSION}.dmg.sha256" \
            "assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip" \
            "assets/BradfordCode-darwin-arm64-${RELEASE_VERSION}.zip.sha256" \
            "assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz" \
            "assets/bradfordcode-reh-linux-x64-${RELEASE_VERSION}.tar.gz.sha256"

      - name: Open auto-release PR
        env:
          BRANCH: ${{ steps.release_branch.outputs.branch }}
        run: |
          set -eo pipefail
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_VERSION}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Auto-generated release PR — the build already succeeded and the
          GitHub Release is already published with signed, notarized artifacts.
          Merging this PR advances main's pinned upstream version and points
          the in-app auto-updater at the new ZIP.

          - **VS Code tag:** \`${MS_TAG}\`
          - **VS Code commit:** \`${MS_COMMIT}\`
          - **GitHub Release:** ${release_url}
          - **Build run:** ${run_url}

          ### Artifact verification

          - DMG SHA-256: \`${DMG_SHA256}\`
          - ZIP SHA-256: \`${ZIP_SHA256}\`

          ### What happens on merge

          - \`upstream/stable.json\` advances to track \`${MS_TAG}\`.
          - \`versions/stable/darwin-arm64/latest.json\` points at the new
            ZIP; the in-app auto-updater (Squirrel.Mac) picks it up on its
            next poll.

          ### Why the build status check is missing

          The build job on this PR is skipped — the same version was just
          built and notarized in run ${GITHUB_RUN_ID} above. The skip is
          gated by the \`auto-release\` label; see the build job \`if:\` in
          \`.github/workflows/cron-build-and-release.yml\`.
          EOF

          # Idempotent. Must filter `--state open`: the branch delete above
          # auto-closes any prior PR, and `gh pr view` would happily return
          # that closed one — leaving a release and branch with no open PR
          # that the next cron's open-only filter would never find.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::Open PR #$existing already exists for $BRANCH; skipping create"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): ${RELEASE_VERSION} (vscode ${MS_TAG})" \
              --label auto-release \
              --body-file "$body_file"
          fi

          # Assign after create, not via `gh pr create --assignee`, and never
          # fatally. By this point the release is already published and the
          # branch pushed; failing the job over an assignment would red-X a run
          # whose actual work succeeded, and re-running it would try to recreate
          # an existing release. Runs for the skip branch too, so an existing PR
          # that somehow lost its assignee gets it back.
          if ! gh pr edit "$BRANCH" --add-assignee "$PR_ASSIGNEE"; then
            echo "::warning::Could not assign $PR_ASSIGNEE to the release PR for $BRANCH. \
          Check they are still a collaborator (gh api /repos/${GITHUB_REPOSITORY}/assignees/$PR_ASSIGNEE)."
          fi

  report-failure:
    name: Open issue on failure
    needs: [check, build, build-reh, release]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # createDispatchEvent needs contents: write. Without it the issue still
      # gets filed but the dispatch 403s and the Claude loop never wakes.
      contents: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MS_TAG: ${{ needs.check.outputs.ms_tag }}
          MS_COMMIT: ${{ needs.check.outputs.ms_commit }}
        with:
          script: |
            const msTag = process.env.MS_TAG || 'unknown';
            const msCommit = process.env.MS_COMMIT || '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titleStem = `Build failure: vscode ${msTag}`;

            const openIssuesLabelled = async (label) => (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            })).data.filter(i => i.title.startsWith(titleStem));

            const commentBody = [
              `Build failure on workflow run [${context.runId}](${runUrl}).`,
              ``,
              `- Triggered by: \`${context.eventName}\``,
              `- VS Code tag: \`${msTag}\``,
              `- Run started: ${new Date().toISOString()}`,
              ``,
              `See the run for full logs.`,
            ].join('\n');

            // If this tag already escalated to a human, record the recurrence
            // and STOP. Without this the loop is perpetual: the auto-fix cap
            // relabels build-failure -> needs-human, the next cron finds no
            // build-failure issue, opens a fresh one with a fresh 3-attempt
            // budget, and burns another Claude run plus two build jobs every
            // day on a problem already handed to a person. 1.133.0 did exactly
            // that (issue #45 escalated, #46 opened three days later).
            const [escalated] = await openIssuesLabelled('needs-human');
            if (escalated) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: escalated.number,
                body: `${commentBody}\n\nStill failing while \`needs-human\` is set on this issue; not re-running the auto-fix loop. Remove the \`needs-human\` label (or add \`build-failure\`) to restart it.`,
              });
              core.warning(
                `vscode ${msTag} already escalated to a human on issue #${escalated.number}; ` +
                `recorded the recurrence and skipped the fix-loop dispatch.`
              );
              return;
            }

            const [existing] = await openIssuesLabelled('build-failure');

            let issueNumber;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });
              core.notice(`Commented on existing issue #${existing.number}`);
              issueNumber = existing.number;
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titleStem} (run ${context.runId})`,
                body: commentBody,
                labels: ['build-failure'],
              });
              core.notice(`Opened issue #${created.number}`);
              issueNumber = created.number;
            }

            // Label-adds by GITHUB_TOKEN don't fire `issues.labeled` on other
            // workflows, so wake claude-build-fix via repository_dispatch,
            // which is exempt. event_type must stay in sync with
            // claude-build-fix.yml's `on.repository_dispatch.types` and with
            // report-pr-failure below. The try/catch surfaces a dropped
            // `contents: write` as a failure rather than a silently green run.
            core.notice(`Dispatching claude-build-fix-trigger for issue #${issueNumber}`);
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'claude-build-fix-trigger',
                client_payload: {
                  issue_number: issueNumber,
                  run_url: runUrl,
                  // The tag/commit the build actually failed on. Without these
                  // the fix workflow stages vscode/ at main's pin, which lags
                  // whenever release PRs sit unmerged — so every attempt began
                  // at the wrong commit and had to roll forward before it could
                  // start, and the vscode/ cache key never matched the target.
                  ms_tag: msTag,
                  ms_commit: msCommit,
                },
              });
            } catch (err) {
              core.setFailed(
                `Failed to dispatch claude-build-fix-trigger for issue #${issueNumber}: ` +
                `${err.status || ''} ${err.message}. ` +
                `Check job permissions — repos.createDispatchEvent requires \`contents: write\`.`
              );
            }

  report-pr-failure:
    name: Dispatch Claude fix loop on PR failure
    needs: [check, build]
    if: |
      failure() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      # createDispatchEvent needs contents: write, not read — otherwise it
      # 403s and the loop breaks after attempt 1.
      contents: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Parse the cron-failure issue number from the PR body's
            // `Refs #<n>` line (claude-build-fix.yml's prompt requires it) so
            // markers and the attempt counter stay on one thread. If absent:
            // Claude-authored → prompt misconfigured, fail loudly;
            // human-authored → not part of the loop, skip quietly so WIP PRs
            // don't carry a red check.
            const body = context.payload.pull_request.body || '';
            // `^…$` with `m` matches only when `Refs #<n>` is the whole line;
            // without it, prose like "tracked in #5" would false-match and
            // desynchronize the counter against the wrong issue.
            const m = body.match(/^Refs #(\d+)$/m);
            if (!m) {
              const author = context.payload.pull_request.user.login;
              if (author === 'claude[bot]') {
                core.setFailed(
                  `Claude-authored PR #${context.issue.number} has no "Refs #<n>" line. ` +
                  `Prompt likely misconfigured — fix loop cannot continue.`
                );
              } else {
                core.notice(
                  `PR #${context.issue.number} (author: ${author}) is not part of ` +
                  `the auto-fix loop (no "Refs #<n>"); skipping dispatch.`
                );
              }
              return;
            }

            const issueNumber = parseInt(m[1], 10);
            core.notice(`Dispatching claude-build-fix-trigger for issue #${issueNumber} (failing run: ${runUrl})`);

            // event_type must match claude-build-fix.yml's
            // `on.repository_dispatch.types` and report-failure above. The
            // try/catch keeps a silent 403 from breaking the loop invisibly.
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'claude-build-fix-trigger',
                client_payload: {
                  issue_number: issueNumber,
                  run_url: runUrl,
                },
              });
            } catch (err) {
              core.setFailed(
                `Failed to dispatch claude-build-fix-trigger for issue #${issueNumber}: ` +
                `${err.status || ''} ${err.message}. ` +
                `Check job permissions — repos.createDispatchEvent requires \`contents: write\`.`
              );
            }
